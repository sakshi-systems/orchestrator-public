[project]
name = "orchestrator"
version = "0.14.0"
description = "Generic AI agent orchestrator — plans, implements, and reviews tasks from a roadmap"
requires-python = ">=3.11"
dependencies = [
    "ruamel-yaml==0.19.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
orchestrator = "orchestrator.main:cli"
orchestrator-launch = "orchestrator.launcher:cli"
orchestrator-answer = "orchestrator.answer:cli"
sakshi = "orchestrator.sakshi:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
